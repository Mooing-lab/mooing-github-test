name: Release mooing-github-test

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  S3_BUCKET: mooing-deploy-artifacts
  AWS_REGION: ap-northeast-2
  # 운영(mooing-kiosk/)과 반드시 다른 prefix. 같으면 동일 태그에서 운영 jar 를 덮어쓴다.
  S3_PREFIX: mooing-github-test

jobs:
  build:
    runs-on: ubuntu-latest
    # AWS OIDC trust policy 의 sub 가 environment 형식이라 필수
    # (repo:Mooing-lab/mooing-github-test:environment:production-mooing-test)
    environment: production-mooing-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Rename artifact with version
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v plain | head -1)
          mv "$JAR_FILE" build/libs/mooing-github-test-${{ steps.version.outputs.VERSION }}.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/libs/mooing-github-test-${{ steps.version.outputs.VERSION }}.jar

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp build/libs/mooing-github-test-${{ steps.version.outputs.VERSION }}.jar \
            s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/mooing-github-test-${{ steps.version.outputs.VERSION }}.jar
